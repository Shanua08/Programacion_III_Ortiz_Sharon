<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transiciones y Animaciones - Línea de Taxis</title>
    <link rel="stylesheet" href="18_transiciones_mp_ortiz_sharon.css">
</head>
<body>
    <main>
        <h1>Recorrido de Unidad</h1>
        <div class="espacio">
            <div class="taxi">🚖</div>
        </div>

        <div class="espacio2">
            <div class="taxi2">🚖</div>
        </div>

        <div class="alerta">Alerta de Central</div>

        <h1>Central de Taxis</h1>
        <p>Coloca el cursor sobre el botón</p>
        <button class="boton-taxi">
            Solicitar Servicio
        </button>
        <div class="tarjeta">
            <h2>Carlos Pérez</h2>
            <p>Conductor Ejecutivo</p>
        </div>

        <br>
        <br>
        <h1>Flota de Vehículos</h1>
        <div class="hangar">
            <div class="nave">Sedán</div>
        </div>

        <h1>Radar de la Cooperativa</h1>
        <div class="radar">
            <div class="indicador">🚖</div>
        </div>

        <h1>Zona de Parqueo</h1>
        <div class="hangar2">
            <div class="nave2">🚖</div>
        </div>
    </main>
</body>
</html>
