<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colores - Línea de Taxi</title>
    <style>
        body {
            background-color: rgb(240, 243, 186);
        }
        h1 {
            color: rgb(12, 144, 192);
        }
        h2 {
            color: rgb(87, 192, 60);
        }
        h3 {
            color: rgb(215, 56, 56);
        }
        h4 {
            color: rgb(88, 25, 25);
        }
        h5 {
            color: rgb(144, 32, 125);
        }
    </style>
</head>
<body>
    <h1>Maneras de establecer colores en la Línea de Taxis</h1>
    <h1>Por nombre de color (Azul corporativo)</h1>
    <h2>Hexadecimal (Verde de unidades activas)</h2>
    <h3>RGB (Rojo de alertas y botón de pánico)</h3>
    <h4>RGBA (Tonos dinámicos para la interfaz)</h4>
    <h5>HSL (Púrpura para servicios ejecutivos)</h5>
</body>
</html>
