<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas</title>
</head>
<body>
    <h1>Tablas en HTML 5</h1>
<table id="personajes_star_wars" alt="Personajes Star Wars" border="1">

    <tr>
        <th colspan="3">Personajes Satr Wars</th>
    </tr>
    <tr>
        <th>Personaje</th>

        <th>Afiliación</th>
    </tr>
    <tr>
        <td>Luck Skywalker</td>
        <td rowspan="2">Tatooine</td>
        <td>Jedi</td>
    </tr>
    <tr>
        <td>Darth Vader</td>
        <td>Sith</td>
    </tr>
    <tr>
        <td>Yoda</td>
        <td>Desconocido</td>
        <td>Jedi</td>
    </tr>
</table>
<br>
<table id="misiones_star_wars" alt="Misiones Star Wars" border="1">

    <thead>
        <tr>
            <th>Caballero Jedi</th>

    <tbody>
        <tr>
            <td>Anakin</td>
            <td>Rescate</td>
            <td>C3P0</td>
        </tr>
        <tr>
            <td>Obiwan</td>
            <td>Rescate</td>
            <td>BBB</td>
        </tr>   
    </tbody>
    <tfoot>
        <tr>
            <th colspan="3">total misiones</th>
            <th> 3</th>
        </tr>
    </tfoot>
   
</table>


</body>
</html>
