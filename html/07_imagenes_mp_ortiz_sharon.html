<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imágenes - Línea de Taxi</title>
</head>
<body>
    <h1>Utilización de la etiqueta Img</h1>
    <img 
    src="../images/taxi_unidad.webp" 
    alt="Unidad de taxi ejecutivo moderna"
    width="300"
    height="300"
    loading="eager"
    >

    <figure>
      <img 
       src="../images/conductor_certificado.webp" 
       alt="Conductor profesional certificado"
       width="300"
       height="300"
       loading="eager">
       <figcaption>Conductor certificado, experto en rutas urbanas seguras</figcaption>
    </figure>

    <a href="https://maps.google.com" target="_blank">
        <img 
            src="../images/logo_taxi.svg"
            alt="Logo de la Línea de Taxis Express"
            width="400"
        >
    </a>
</body>
</html>
