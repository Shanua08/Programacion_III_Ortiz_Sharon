<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMagenes</title>
</head>
<body>
    <h1>Utilización de la etiqueta Img</h1>
    <img 
    src="images/Yoda.webp" 
    alt="Yoda"
    width="300"
    height="300"
    loading="eager"
    >

    <figure>
      <img 
       src="../images/yoda1.webp" 
       alt="Yoda"
       width="300"
       height="300"
       loading="eager">
       <figcaption>Maestro Yoda, integrante del Consejo Jedi</figcaption>
    </figure>
    <a href="https://es.wikipedia.org/wiki/Star_Wars" target="_blank">
        <img 
            src="../images/Star_Wars.svg"
            alt="Logo de Star Wars"
            width="400"
        >
    </a>


</body>
</html>
