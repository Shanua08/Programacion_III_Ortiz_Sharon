<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de misiones</title>
</head>
<body>
    <form action="/registro" method="post">
        <table>
            <tr>
                <td>
                    <label for="password">Password</label> 
                    <input type="text" id="nombre" name="nombre">
                </td>
                <td>
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="nombre">
                </td>
                <td>
                    <label for="password">Password</label><br>
                    <input type="password" id="password" name="password">
                </td>
                <td>
                    <label for="password_confirm">Confirmar Password</label>
                    <input type="password" id="password" name="password">
                </td>
                <td>
                    <label for="edad">Edad</label>
                    <input type="number" id="edad" name="edad">
                </td>
                <td>
                    <label for="nivel">Nivel de la fuerza</label><br>
                    <input
                        type="number"
                        id="nivel"
                        name="nivel"
                        min="10"
                        max="100"
                        value="50"
                        step="5"
                    >
                </td>
            </tr>
            <tr>
                <td>
                    <p>Selecciona tu bando:</p>
                    <input type="radio" id="jedi" name="bando" value="jedi">
                    <label for="jedi">Jedi</label>
                    <input type="radio" id="sith" name="bando" value="sith">
                    <label for="jedi">Sith</label>
                </td>
                <td>
                    <p for="nivel">Seleccione tus habilidad:</p><br>
                    <input 
                        type="checkbox"
                        id="fuerza"
                        name="habilidades"
                        value="fuerza"
                    >
                    <label for="fuerza">Uso de fuerza:</label><br>
                    <input
                        type="checkbox"
                        id="sable"
                        name="habilidades"
                        value="sable"
                    >
                    <label for="sable">Uso del sable:</label><br>
                    <input
                        type="checkbox"
                        id="levitar"
                        name="habilidades"
                        value="levitar"
                    >
                    <label for="levitar">levitar</label><br>
                </td>
            </tr>
             <tr>
                <td>
                    <label for="edad">Planeta de Origen</label><br>
                    <select id="planeta" name="planeta" required>
                        <option value="">
                            Selecciona un planeta 
                        </option>
                        <option value="Tatoonie">
                            Tatoniie
                        </option>
                        <option value=" Coruscant">
                            Coruscant
                        </option>
                        <option value=" naboo">
                            naboo
                        </option>
                    </select>
                </td>
                <td>
                    <label for="edad">Droide</label><br>
                    <select id="droide" name="droide" multiple size="2">
                        <option value="">
                            Selecciona un drodie 
                        </option>
                        <option value="bb8">
                            BB8
                        </option>
                        <option value="NABOO">
                            R2D2
                        </option>

                    </select>
                </td>
            </tr>
             <td>
                <fieldset>
                    <legend>Datos generales</legend> 
                    <label for="misiones">Misiones</label><brZ
                    <input type="number" id="misiones" name="misiones"><br>
                 </fieldset> 
             
                </td>
        </table>
        <button type="submit">Enviar</button> 
        <button type="RESET">Enviar</button> 
    </form>
</body>
</html>
